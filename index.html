<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Life OS</title>
<link rel="stylesheet" href="styles.css?v=9" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="app.js?v=9"></script>
</head>
<body>
<div x-data="lifeOS" x-cloak>

  <!-- MACOS CONTROLS -->
  <div class="mac-controls">
    <div class="mac-dot close" title="Đóng"></div>
    <div class="mac-dot min" @click="sidebarOpen = !sidebarOpen" title="Thu nhỏ"></div>
    <div class="mac-dot max" @click="view='settings'" title="Cài đặt"></div>
  </div>

  <!-- DYNAMIC ISLAND -->
  <template x-if="$store.db.settings.glass.dynamicIsland">
    <div class="dynamic-island" :class="{expanded: diExpanded}" @click="diExpanded = !diExpanded" style="position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:200;width:180px;height:36px;border-radius:22px;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:0.5s cubic-bezier(0.34, 1.56, 0.64, 1);overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,0.5);">
      <div x-show="!diExpanded" style="font-size:12px;font-family:monospace;display:flex;gap:8px;align-items:center;">
        <span style="width:8px;height:8px;background:#34c759;border-radius:50%"></span>
        <span x-text="diCompactText()"></span>
      </div>
      <div x-show="diExpanded" style="padding:20px;width:380px;height:160px;position:absolute;top:0;left:0;">
        <div style="font-size:14px;font-weight:600;margin-bottom:12px" x-text="diGreeting()"></div>
        <div style="font-size:12px;color:#aaa;margin-bottom:8px" x-show="diNextTask()" x-text="diNextTask()"></div>
        <div style="font-size:12px;color:#aaa" x-text="diHabitsLine()"></div>
      </div>
    </div>
  </template>
  
  <button class="sidebar-toggle glass" @click="toggleSidebar()"><span x-text="sidebarOpen ? '◀' : '☰'"></span></button>
  <div class="backdrop" x-show="sidebarOpen" @click="sidebarOpen=false" x-cloak style="position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:35;display:none;" :style="sidebarOpen ? 'display:block' : 'display:none'"></div>

  <aside class="sidebar glass" :class="{closed: !sidebarOpen}">
    <div class="brand"><span class="brand-dot"></span> Life OS</div>
    <div class="nav-scroll">
      <template x-for="grp in nav" :key="grp.group">
        <div class="nav-group">
          <div class="nav-group-label" x-text="grp.group"></div>
          <template x-for="item in grp.items" :key="item.id">
            <button class="nav-btn" :class="{active: view===item.id}" @click="view=item.id">
              <span class="nav-icon" x-text="item.icon"></span>
              <span class="nav-label" x-text="item.label"></span>
            </button>
          </template>
        </div>
      </template>
    </div>
    <div class="sidebar-foot">
      <button class="nav-btn" @click="showAuth = true">
        <span class="nav-icon">☁️</span><span class="nav-label">Đồng bộ</span>
      </button>
    </div>
  </aside>

  <main class="main" :class="{expanded: !sidebarOpen}">
    <section class="content" style="padding-right: 340px;"> <!-- Chừa chỗ cho Inspector nếu ở Settings -->
      <template x-if="view==='dashboard'"><div x-data="m_dashboard" x-html="tpl" x-init="$nextTick(()=>Alpine.initTree($el))"></div></template>
      <template x-if="view==='timeline'"><div x-data="m_timeline" x-html="tpl" x-init="$nextTick(()=>Alpine.initTree($el))"></div></template>
      <template x-if="view==='tasks'"><div x-data="m_tasks" x-html="tpl" x-init="$nextTick(()=>Alpine.initTree($el))"></div></template>
      <template x-if="view==='settings'"><div x-data="m_settings" x-html="tpl" x-init="$nextTick(()=>Alpine.initTree($el))"></div></template>
      <!-- Các module khác giữ nguyên -->
    </section>
  </main>

  <!-- AUTH MODAL -->
  <div class="modal-backdrop" x-show="showAuth" x-cloak @click.self="showAuth=false" style="position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;display:flex;align-items:center;justify-content:center;">
    <div class="modal glass" @click.stop style="padding:30px;border-radius:24px;width:100%;max-width:400px;">
      <h2 style="margin-top:0">☁️ Đồng bộ</h2>
      <template x-if="!user">
        <div>
          <p style="font-size:13px;color:#aaa;margin-bottom:16px">Đăng nhập để đồng bộ dữ liệu lên mây.</p>
          <input class="input" x-model="authEmail" placeholder="Email" style="margin-bottom:10px" />
          <input class="input" type="password" x-model="authPass" placeholder="Mật khẩu" style="margin-bottom:16px" />
          <div class="row" style="display:flex;gap:10px">
            <button class="btn primary" @click="doLogin()">Đăng nhập</button>
            <button class="btn" @click="doSignup()">Đăng ký</button>
          </div>
        </div>
      </template>
      <template x-if="user">
        <div>
          <p>Đã đăng nhập: <b x-text="user.email"></b></p>
          <button class="btn" @click="doLogout()">Đăng xuất</button>
        </div>
      </template>
    </div>
  </div>

</div>
</body>
</html>
