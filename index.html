<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Life OS</title>
<link rel="stylesheet" href="styles.css?v=8" />
<!-- Load Supabase & Alpine -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="app.js?v=8"></script>
</head>
<body>
<div x-data="lifeOS" x-cloak>

  <!-- MACOS WINDOW CONTROLS -->
  <div class="mac-controls">
    <div class="mac-dot close"></div>
    <div class="mac-dot min"></div>
    <div class="mac-dot max"></div>
  </div>

  <!-- DYNAMIC ISLAND -->
  <template x-if="$store.db.settings.glass.dynamicIsland">
    <div class="dynamic-island" :class="{expanded: diExpanded}" @click="diExpanded = !diExpanded">
      <div class="di-compact"><span class="di-dot"></span><span x-text="diCompactText()"></span></div>
      <div class="di-expanded">
        <div class="di-expanded-inner">
          <div class="di-line"><span class="di-badge">🗓</span><span x-text="diGreeting()"></span></div>
          <div class="di-line" x-show="diNextTask()"><span class="di-badge">⏱</span><span x-text="diNextTask()"></span></div>
          <div class="di-line"><span class="di-badge">🔁</span><span x-text="diHabitsLine()"></span></div>
        </div>
      </div>
    </div>
  </template>
  
  <button class="sidebar-toggle glass" @click="toggleSidebar()"><span x-text="sidebarOpen ? '◀' : '☰'"></span></button>
  <div class="backdrop" x-show="sidebarOpen" @click="sidebarOpen=false" x-cloak></div>

  <aside class="sidebar glass" :class="{closed: !sidebarOpen}">
    <div class="brand"><span class="brand-dot"></span> Life OS</div>
    <div class="nav-scroll">
      <template x-for="grp in nav" :key="grp.group">
        <div class="nav-group">
          <div class="nav-group-label" x-text="grp.group"></div>
          <template x-for="item in grp.items" :key="item.id">
            <button class="nav-btn" :class="{active: view===item.id}" @click="view=item.id">
              <span class="nav-icon" x-text="item.icon"></span>
              <span class="nav-label" x-text="item.label"></span>
            </button>
          </template>
        </div>
      </template>
    </div>
    <div class="sidebar-foot">
      <button class="nav-btn" @click="toggleTheme()">
        <span class="nav-icon" x-text="$store.db.settings.theme==='dark' ? '☀️' : '🌙'"></span>
        <span class="nav-label">Giao diện</span>
      </button>
    </div>
  </aside>

  <main class="main" :class="{expanded: !sidebarOpen}">
    <section class="content">
      <template x-if="view==='dashboard'"><div x-data="m_dashboard" x-html="tpl" x-init="$nextTick(()=>Alpine.initTree($el))"></div></template>
      <template x-if="view==='timeline'"><div x-data="m_timeline" x-html="tpl" x-init="$nextTick(()=>Alpine.initTree($el))"></div></template>
      <template x-if="view==='week'"><div x-data="m_week" x-html="tpl" x-init="$nextTick(()=>Alpine.initTree($el))"></div></template>
      <template x-if="view==='tasks'"><div x-data="m_tasks" x-html="tpl" x-init="$nextTick(()=>Alpine.initTree($el))"></div></template>
      <template x-if="view==='habits'"><div x-data="m_habits" x-html="tpl" x-init="$nextTick(()=>Alpine.initTree($el))"></div></template>
      <template x-if="view==='journal'"><div x-data="m_journal" x-html="tpl" x-init="$nextTick(()=>Alpine.initTree($el))"></div></template>
      <template x-if="view==='reviews'"><div x-data="m_reviews" x-html="tpl" x-init="$nextTick(()=>Alpine.initTree($el))"></div></template>
      <template x-if="view==='meals'"><div x-data="m_meals" x-html="tpl" x-init="$nextTick(()=>Alpine.initTree($el))"></div></template>
      <template x-if="view==='learning'"><div x-data="m_learning" x-html="tpl" x-init="$nextTick(()=>Alpine.initTree($el))"></div></template>
      <template x-if="view==='relationships'"><div x-data="m_relationships" x-html="tpl" x-init="$nextTick(()=>Alpine.initTree($el))"></div></template>
      <template x-if="view==='archive'"><div x-data="m_archive" x-html="tpl" x-init="$nextTick(()=>Alpine.initTree($el))"></div></template>
      <template x-if="view==='goals'"><div x-data="m_goals" x-html="tpl" x-init="$nextTick(()=>Alpine.initTree($el))"></div></template>
      <template x-if="view==='finance'"><div x-data="m_finance" x-html="tpl" x-init="$nextTick(()=>Alpine.initTree($el))"></div></template>
      <template x-if="view==='health'"><div x-data="m_health" x-html="tpl" x-init="$nextTick(()=>Alpine.initTree($el))"></div></template>
      <template x-if="view==='vision'"><div x-data="m_vision" x-html="tpl" x-init="$nextTick(()=>Alpine.initTree($el))"></div></template>
      <template x-if="view==='settings'"><div x-data="m_settings" x-html="tpl" x-init="$nextTick(()=>Alpine.initTree($el))"></div></template>
    </section>
  </main>

  <!-- AUTH / SYNC MODAL -->
  <div class="modal-backdrop" x-show="showAuth" x-cloak @click.self="showAuth=false">
    <div class="modal glass mac-inspector" @click.stop>
      <h2 style="margin-top:0">Đăng nhập / Đồng bộ</h2>
      <p class="muted small">Đồng bộ dữ liệu lên mây để dùng trên nhiều thiết bị.</p>
      <template x-if="!user">
        <div>
          <input class="input" x-model="authEmail" placeholder="Email" style="margin-bottom:10px" />
          <input class="input" type="password" x-model="authPass" placeholder="Mật khẩu" style="margin-bottom:14px" />
          <div class="row">
            <button class="btn primary" @click="doLogin()">Đăng nhập</button>
            <button class="btn" @click="doSignup()">Đăng ký</button>
          </div>
        </div>
      </template>
      <template x-if="user">
        <div>
          <p>Đã đăng nhập: <b x-text="user.email"></b></p>
          <div class="row">
            <button class="btn" @click="forceSync()">🔄 Sync ngay</button>
            <button class="btn" style="color:#ff3b30" @click="doLogout()">Đăng xuất</button>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- EXPORT MODAL, COMMAND PALETTE, BOTTOM NAV (Giữ nguyên như cũ) -->
  <!-- ... (Copy phần Export Modal / Palette / Bottom Nav từ file cũ của bạn vào đây) ... -->
  
  <!-- BOTTOM NAV -->
  <template x-if="$store.db.settings.glass.bottomNav">
    <nav class="bottom-nav">
      <div class="bn-pill" :style="'transform: translateX(' + bnIndex()*100 + '%)'"></div>
      <template x-for="(it, i) in bnItems()" :key="it.id">
        <button class="bn-item" :class="{active: view===it.id}" @click="view=it.id">
          <span class="bn-icon" x-text="it.icon"></span><span class="bn-label" x-text="it.label"></span>
        </button>
      </template>
    </nav>
  </template>

</div>
</body>
</html>
