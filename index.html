<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Life OS</title>
<link rel="stylesheet" href="styles.css?v=5" />
<script type="module" src="app.js?v=6"></script>
</head>
<body>
<div x-data="lifeOS" x-cloak>

  <button class="sidebar-toggle glass" @click="toggleSidebar()">
    <span x-text="sidebarOpen ? '◀' : '☰'"></span>
  </button>
  <div class="backdrop" x-show="sidebarOpen" @click="sidebarOpen=false" x-cloak></div>

  <aside class="sidebar glass" :class="{closed: !sidebarOpen}">
    <div class="brand"><span class="brand-dot"></span> Life OS</div>
    <div class="nav-scroll">
      <template x-for="grp in nav" :key="grp.group">
        <div class="nav-group">
          <div class="nav-group-label" x-text="grp.group"></div>
          <template x-for="item in grp.items" :key="item.id">
            <button class="nav-btn" :class="{active: view===item.id}" @click="view=item.id">
              <span class="nav-icon" x-text="item.icon"></span>
              <span class="nav-label" x-text="item.label"></span>
            </button>
          </template>
        </div>
      </template>
    </div>
    <div class="sidebar-foot">
      <button class="nav-btn" @click="toggleTheme()">
        <span class="nav-icon" x-text="$store.db.settings.theme==='dark' ? '☀️' : '🌙'"></span>
        <span class="nav-label" x-text="$store.db.settings.theme==='dark' ? 'Chế độ sáng' : 'Chế độ tối'"></span>
      </button>
      <button class="nav-btn" @click="openPalette()">
        <span class="nav-icon">⌘</span><span class="nav-label">Command Palette</span>
      </button>
    </div>
  </aside>

  <main class="main" :class="{expanded: !sidebarOpen}">
    <section class="content">

      <template x-if="view==='dashboard'"><div x-data="m_dashboard" x-html="tpl" x-init="$nextTick(()=>Alpine.initTree($el))"></div></template>
      <template x-if="view==='timeline'"><div x-data="m_timeline" x-html="tpl" x-init="$nextTick(()=>Alpine.initTree($el))"></div></template>
      <template x-if="view==='week'"><div x-data="m_week" x-html="tpl" x-init="$nextTick(()=>Alpine.initTree($el))"></div></template>
      <template x-if="view==='tasks'"><div x-data="m_tasks" x-html="tpl" x-init="$nextTick(()=>Alpine.initTree($el))"></div></template>
      <template x-if="view==='habits'"><div x-data="m_habits" x-html="tpl" x-init="$nextTick(()=>Alpine.initTree($el))"></div></template>
      <template x-if="view==='journal'"><div x-data="m_journal" x-html="tpl" x-init="$nextTick(()=>Alpine.initTree($el))"></div></template>
      <template x-if="view==='reviews'"><div x-data="m_reviews" x-html="tpl" x-init="$nextTick(()=>Alpine.initTree($el))"></div></template>
      <template x-if="view==='meals'"><div x-data="m_meals" x-html="tpl" x-init="$nextTick(()=>Alpine.initTree($el))"></div></template>
      <template x-if="view==='learning'"><div x-data="m_learning" x-html="tpl" x-init="$nextTick(()=>Alpine.initTree($el))"></div></template>
      <template x-if="view==='relationships'"><div x-data="m_relationships" x-html="tpl" x-init="$nextTick(()=>Alpine.initTree($el))"></div></template>
      <template x-if="view==='archive'"><div x-data="m_archive" x-html="tpl" x-init="$nextTick(()=>Alpine.initTree($el))"></div></template>
      <template x-if="view==='goals'"><div x-data="m_goals" x-html="tpl" x-init="$nextTick(()=>Alpine.initTree($el))"></div></template>
      <template x-if="view==='finance'"><div x-data="m_finance" x-html="tpl" x-init="$nextTick(()=>Alpine.initTree($el))"></div></template>
      <template x-if="view==='health'"><div x-data="m_health" x-html="tpl" x-init="$nextTick(()=>Alpine.initTree($el))"></div></template>
      <template x-if="view==='vision'"><div x-data="m_vision" x-html="tpl" x-init="$nextTick(()=>Alpine.initTree($el))"></div></template>
      <template x-if="view==='settings'"><div x-data="m_settings" x-html="tpl" x-init="$nextTick(()=>Alpine.initTree($el))"></div></template>

    </section>
  </main>

  <!-- EXPORT MODAL -->
  <div class="modal-backdrop" x-show="showExport" x-cloak @click.self="showExport=false">
    <div class="modal glass" @click.stop>
      <div class="row row-between"><h2 style="margin:0">📤 Export</h2><button class="icon-btn" @click="showExport=false">✕</button></div>
      <div class="row" style="margin-top:16px">
        <div style="flex:1"><div class="card-title">Phần</div>
          <select class="input" x-model="exportSection">
            <option value="all">Tất cả</option><option value="tasks">Tasks</option><option value="timeline">Timeline</option>
            <option value="habits">Habits</option><option value="journal">Journal</option><option value="finance">Finance</option><option value="health">Health</option>
          </select>
        </div>
        <div style="flex:1"><div class="card-title">Kỳ</div>
          <select class="input" x-model="exportPeriod">
            <option value="day">Hôm nay</option><option value="week">Tuần</option><option value="month">Tháng</option>
            <option value="quarter">Quý</option><option value="year">Năm</option><option value="all">Toàn bộ</option>
          </select>
        </div>
        <div style="flex:1"><div class="card-title">Định dạng</div>
          <select class="input" x-model="exportType">
            <option value="ai">🤖 Prompt AI</option><option value="md">📝 Markdown</option><option value="json">🗄 JSON</option>
            <option value="csv">📊 CSV</option><option value="xls">📊 Excel</option><option value="doc">📄 Word</option>
          </select>
        </div>
      </div>
      <div class="card-title" style="margin-top:16px">Xem trước</div>
      <textarea class="textarea" readonly rows="10" x-model="exportPreview" style="font-family:monospace;font-size:12px"></textarea>
      <div class="row" style="margin-top:12px">
        <button class="btn primary" @click="downloadExport()">⬇️ Tải</button>
        <button class="btn" @click="copyExport()">📋 Copy</button>
        <span class="muted small" x-show="copiedMsg" x-text="copiedMsg"></span>
      </div>
    </div>
  </div>

  <!-- COMMAND PALETTE -->
  <div class="modal-backdrop palette-backdrop" x-show="paletteOpen" x-cloak @click.self="paletteOpen=false">
    <div class="palette glass" @click.stop>
      <input class="palette-input" x-model="paletteQuery" x-ref="paletteInput"
             @keydown.escape="paletteOpen=false"
             @keydown.enter="runCmd(filteredCmds()[0])"
             placeholder="Ctrl/⌘/Win + K — gõ để tìm..." />
      <div class="palette-list">
        <template x-for="cmd in filteredCmds()" :key="cmd.id">
          <div class="palette-item" @click="runCmd(cmd)">
            <span x-text="cmd.icon"></span><span x-text="cmd.label"></span><span class="palette-hint" x-text="cmd.hint"></span>
          </div>
        </template>
      </div>
    </div>
  </div>

</div>
</body>
</html>
