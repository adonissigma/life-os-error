<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Life OS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧊</text></svg>" />
<link rel="stylesheet" href="styles.css?v=9" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="app.js?v=9"></script>
</head>
<body>
<div x-data="lifeOS" x-cloak style="display:flex; width:100vw; height:100vh;">

  <!-- MACOS CONTROLS -->
  <div class="mac-controls">
    <div class="mac-dot close" title="Đóng"></div>
    <div class="mac-dot min" @click="sidebarOpen = !sidebarOpen" title="Thu nhỏ"></div>
    <div class="mac-dot max" @click="view='settings'" title="Cài đặt"></div>
  </div>

  <!-- DYNAMIC ISLAND -->
  <template x-if="$store.db.settings.glass.dynamicIsland">
    <div class="dynamic-island" :class="{expanded: diExpanded}" @click="diExpanded = !diExpanded">
      <div x-show="!diExpanded" class="di-compact">
        <span class="di-dot"></span><span x-text="diCompactText()"></span>
      </div>
      <div x-show="diExpanded" class="di-expanded">
        <div class="di-line">🗓 <span x-text="diGreeting()"></span></div>
        <div class="di-line">⏱ <span x-text="diNextTask()"></span></div>
        <div class="di-line">🔁 <span x-text="diHabitsLine()"></span></div>
      </div>
    </div>
  </template>
  
  <button class="sidebar-toggle glass" @click="toggleSidebar()"><span x-text="sidebarOpen ? '◀' : '☰'"></span></button>
  <div class="backdrop" x-show="sidebarOpen" @click="sidebarOpen=false" x-cloak></div>

  <aside class="sidebar glass" :class="{closed: !sidebarOpen}">
    <div class="brand"><span class="brand-dot"></span> Life OS</div>
    <div class="nav-scroll">
      <template x-for="grp in nav" :key="grp.group">
        <div class="nav-group">
          <div class="nav-group-label" x-text="grp.group"></div>
          <template x-for="item in grp.items" :key="item.id">
            <button class="nav-btn" :class="{active: view===item.id}" @click="view=item.id">
              <span class="nav-icon" x-text="item.icon"></span>
              <span class="nav-label" x-text="item.label"></span>
            </button>
          </template>
        </div>
      </template>
    </div>
    <div class="sidebar-foot">
      <button class="nav-btn" @click="showAuth = true">
        <span class="nav-icon">☁️</span><span class="nav-label">Đồng bộ (Auth)</span>
      </button>
    </div>
  </aside>

  <main class="main" :class="{expanded: !sidebarOpen}">
    <section class="content">
      <template x-if="view==='dashboard'"><div x-data="m_dashboard" x-html="tpl" x-init="$nextTick(()=>Alpine.initTree($el))"></div></template>
      <template x-if="view==='timeline'"><div x-data="m_timeline" x-html="tpl" x-init="$nextTick(()=>Alpine.initTree($el))"></div></template>
      <template x-if="view==='tasks'"><div x-data="m_tasks" x-html="tpl" x-init="$nextTick(()=>Alpine.initTree($el))"></div></template>
      <template x-if="view==='habits'"><div x-data="m_habits" x-html="tpl" x-init="$nextTick(()=>Alpine.initTree($el))"></div></template>
      <template x-if="view==='journal'"><div x-data="m_journal" x-html="tpl" x-init="$nextTick(()=>Alpine.initTree($el))"></div></template>
      <template x-if="view==='settings'"><div x-data="m_settings" x-html="tpl" x-init="$nextTick(()=>Alpine.initTree($el))"></div></template>
      <!-- Các module khác tự load nếu bạn đã tạo -->
    </section>
  </main>

  <!-- AUTH MODAL -->
  <div class="modal-backdrop" x-show="showAuth" x-cloak @click.self="showAuth=false">
    <div class="modal glass" @click.stop>
      <h2 style="margin-top:0">☁️ Đồng bộ Đám mây</h2>
      <template x-if="!user">
        <div>
          <p style="font-size:13px;opacity:0.8;margin-bottom:16px">Đăng nhập để đồng bộ dữ liệu trên nhiều thiết bị.</p>
          <input class="input" x-model="authEmail" placeholder="Email" style="margin-bottom:10px" />
          <input class="input" type="password" x-model="authPass" placeholder="Mật khẩu" style="margin-bottom:16px" />
          <div class="row">
            <button class="btn primary" @click="doLogin()">Đăng nhập</button>
            <button class="btn" @click="doSignup()">Đăng ký</button>
          </div>
        </div>
      </template>
      <template x-if="user">
        <div>
          <p>Đã đăng nhập: <b x-text="user.email"></b></p>
          <div class="row">
            <button class="btn primary" @click="forceSync()">🔄 Sync ngay</button>
            <button class="btn" style="color:#ff3b30" @click="doLogout()">Đăng xuất</button>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <template x-if="$store.db.settings.glass.bottomNav">
    <nav class="bottom-nav">
      <div class="bn-pill" :style="'transform: translateX(' + bnIndex()*100 + '%)'"></div>
      <template x-for="(it, i) in bnItems()" :key="it.id">
        <button class="bn-item" :class="{active: view===it.id}" @click="view=it.id">
          <span class="bn-icon" x-text="it.icon"></span><span class="bn-label" x-text="it.label"></span>
        </button>
      </template>
    </nav>
  </template>

</div>
</body>
</html>
